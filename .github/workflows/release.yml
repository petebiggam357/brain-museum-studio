name: Build & Publish Cross-Platform Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pytest -v

  build-binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: brain-museum-studio-linux-x64
            add_data_sep: ":"
            archive: tar.gz
            extra_pkgs: "pywebview PyQt6 PyQt6-WebEngine qtpy"
            icon_flag: ""
            windowed_flag: ""
          - os: macos-latest
            artifact_name: brain-museum-studio-macos-arm64
            add_data_sep: ":"
            archive: tar.gz
            extra_pkgs: "pywebview"
            icon_flag: ""
            windowed_flag: "--windowed"
          - os: windows-latest
            artifact_name: brain-museum-studio-windows-x64
            add_data_sep: ";"
            archive: zip
            extra_pkgs: "pywebview"
            icon_flag: "--icon packaging/brain-museum-studio.ico"
            windowed_flag: "--windowed"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller ${{ matrix.extra_pkgs }}
      - name: Build self-contained native desktop executable
        shell: bash
        run: |
          pyinstaller \
            --onefile \
            --name brain-museum-studio \
            ${{ matrix.windowed_flag }} \
            ${{ matrix.icon_flag }} \
            --add-data "muse2_studio/static${{ matrix.add_data_sep }}muse2_studio/static" \
            --add-data "packaging/brain-museum-studio.png${{ matrix.add_data_sep }}packaging" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            muse2_studio/cli.py
      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p release_assets
          if [ -d dist/brain-museum-studio.app ]; then
            tar -czf "release_assets/${{ matrix.artifact_name }}.tar.gz" -C dist brain-museum-studio.app
          else
            tar -czf "release_assets/${{ matrix.artifact_name }}.tar.gz" -C dist brain-museum-studio
          fi
      - name: Build Linux AppImage (Self-Contained Native Window + Icon)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/brain-museum-studio AppDir/usr/bin/brain-museum-studio
          chmod +x AppDir/usr/bin/brain-museum-studio
          cp packaging/brain-museum-studio.desktop AppDir/brain-museum-studio.desktop
          cp packaging/brain-museum-studio.png AppDir/brain-museum-studio.png
          cp packaging/brain-museum-studio.svg AppDir/brain-museum-studio.svg
          cp packaging/brain-museum-studio.png AppDir/usr/share/icons/hicolor/256x256/apps/brain-museum-studio.png
          ln -sf brain-museum-studio.png AppDir/.DirIcon
          cat <<'EOF' > AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export QTWEBENGINE_DISABLE_SANDBOX=1
          exec "${HERE}/usr/bin/brain-museum-studio" "$@"
          EOF
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "release_assets/BrainMuseumStudio-x86_64.AppImage"
      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets | Out-Null
          Compress-Archive -Path dist/brain-museum-studio.exe -DestinationPath "release_assets/${{ matrix.artifact_name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release_assets/*

  build-python-dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-binaries, build-python-dist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: all_assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: all_assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all_assets/*
          body_path: CHANGELOG.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
