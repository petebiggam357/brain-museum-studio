[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-museum-studio"
version = "0.0.8"
description = "Brain Museum Studio — Cross-platform (Linux-first) real-time Muse 2 EEG/PPG dashboard, 3D Brain visualizer, Neuro Lab, 6 mind-controlled games, Zen Meditation, BCI, OSC & ML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.22.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.1",
]

[project.scripts]
brain-museum-studio = "muse2_studio.cli:main"

[tool.setuptools.packages.find]
include = ["muse2_studio*"]

[tool.setuptools.package-data]
muse2_studio = ["static/*"]
